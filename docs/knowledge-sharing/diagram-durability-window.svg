<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#374151"/>
    </marker>
    <pattern id="lost" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#fee2e2"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#dc2626" stroke-width="2.5"/>
    </pattern>
  </defs>

  <text x="30" y="40" font-size="24" font-weight="700" fill="#111827">The durability window: uploads race the trimmer</text>
  <text x="30" y="64" font-size="13" fill="#6b7280">offset / time increases left → right · publishers append at the right · local retention trims from the left</text>

  <!-- ============ NORMAL ============ -->
  <text x="30" y="104" font-size="16" font-weight="700" fill="#166534">Normal: the trimmer only deletes data that is already in S3</text>

  <!-- regions -->
  <rect x="80"  y="118" width="160" height="58" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="240" y="118" width="460" height="58" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="700" y="118" width="160" height="58" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>

  <text x="160" y="152" font-size="11.5" fill="#1d4ed8" text-anchor="middle">in S3 only</text>
  <text x="470" y="146" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">on disk AND in S3</text>
  <text x="470" y="163" font-size="11.5" fill="#166534" text-anchor="middle">the safe margin</text>
  <text x="780" y="146" font-size="11.5" fill="#854d0e" text-anchor="middle">on disk only</text>
  <text x="780" y="163" font-size="11.5" fill="#854d0e" text-anchor="middle">(un-uploaded tail)</text>

  <!-- edges -->
  <line x1="240" y1="108" x2="240" y2="196" stroke="#dc2626" stroke-width="2.5"/>
  <text x="240" y="212" font-size="11.5" fill="#b91c1c" text-anchor="middle">trim edge →</text>
  <line x1="700" y1="108" x2="700" y2="196" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="700" y="212" font-size="11.5" fill="#1d4ed8" text-anchor="middle">upload edge →</text>
  <text x="860" y="212" font-size="11.5" fill="#374151" text-anchor="middle">newest</text>
  <line x1="864" y1="147" x2="900" y2="147" stroke="#374151" stroke-width="2" marker-end="url(#a3)"/>

  <!-- ============ OUTAGE ============ -->
  <text x="30" y="296" font-size="16" font-weight="700" fill="#b91c1c">S3 unavailable: the upload edge freezes, the trimmer marches on</text>

  <rect x="80"  y="310" width="320" height="58" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="400" y="310" width="160" height="58" fill="url(#lost)" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="560" y="310" width="300" height="58" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>

  <text x="240" y="344" font-size="11.5" fill="#1d4ed8" text-anchor="middle">durable in S3</text>
  <text x="480" y="338" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">LOST</text>
  <text x="480" y="355" font-size="10.5" fill="#b91c1c" text-anchor="middle">gone from both tiers</text>
  <text x="710" y="344" font-size="11.5" fill="#854d0e" text-anchor="middle">on disk only (un-uploaded)</text>

  <!-- frozen upload edge -->
  <line x1="400" y1="300" x2="400" y2="388" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="400" y="404" font-size="11.5" fill="#1d4ed8" text-anchor="middle">upload edge (frozen ✕)</text>
  <!-- trim edge crossed past -->
  <line x1="560" y1="300" x2="560" y2="388" stroke="#dc2626" stroke-width="2.5"/>
  <text x="560" y="404" font-size="11.5" fill="#b91c1c" text-anchor="middle">trim edge (marched past) →</text>
  <text x="860" y="404" font-size="11.5" fill="#374151" text-anchor="middle">newest</text>
  <line x1="864" y1="339" x2="900" y2="339" stroke="#374151" stroke-width="2" marker-end="url(#a3)"/>
</svg>
