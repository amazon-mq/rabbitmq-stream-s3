<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="30" y="40" font-size="24" font-weight="700" fill="#111827">Journey of a record: the upload is a side branch</text>

  <!-- WRITE PATH band -->
  <rect x="24" y="70" width="912" height="118" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="44" y="96" font-size="15" font-weight="700" fill="#166534">Write path: synchronous, entirely local. Publish latency is unchanged.</text>

  <g font-size="13" fill="#14532d" text-anchor="middle">
    <rect x="44"  y="112" width="140" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="114" y="136">client</text><text x="114" y="154">publishes record</text>

    <rect x="214" y="112" width="150" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="289" y="136">writer batches</text><text x="289" y="154">into a chunk</text>

    <rect x="394" y="112" width="160" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="474" y="136">replicate to</text><text x="474" y="154">a majority</text>

    <rect x="584" y="112" width="120" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="644" y="136">commit</text><text x="644" y="154">(durable locally)</text>

    <rect x="734" y="112" width="158" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="813" y="136">confirm</text><text x="813" y="154">to client</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#a2)">
    <line x1="184" y1="140" x2="212" y2="140"/>
    <line x1="364" y1="140" x2="392" y2="140"/>
    <line x1="554" y1="140" x2="582" y2="140"/>
    <line x1="704" y1="140" x2="732" y2="140"/>
  </g>

  <!-- branch connector down from commit -->
  <line x1="644" y1="188" x2="644" y2="250" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="656" y="222" font-size="12.5" fill="#1d4ed8">committed chunks become available to the upload path</text>

  <!-- UPLOAD PATH band -->
  <rect x="24" y="258" width="912" height="132" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="44" y="284" font-size="15" font-weight="700" fill="#1d4ed8">Upload path: background and asynchronous. An S3 outage cannot stall publishing.</text>

  <g font-size="13" fill="#1e3a8a" text-anchor="middle">
    <rect x="44"  y="300" width="180" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="134" y="326">replica reader drains</text><text x="134" y="344">committed chunks</text>

    <rect x="254" y="300" width="170" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="339" y="326">assemble fragment</text><text x="339" y="344">(target ~64 MiB)</text>

    <rect x="454" y="300" width="160" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="534" y="326">governor paces</text><text x="534" y="344">transfer (token bucket)</text>

    <rect x="644" y="300" width="180" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="734" y="322">PUT to S3,</text><text x="734" y="340">then update</text><text x="734" y="357">manifest</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#a2)">
    <line x1="224" y1="332" x2="252" y2="332"/>
    <line x1="424" y1="332" x2="452" y2="332"/>
    <line x1="614" y1="332" x2="642" y2="332"/>
  </g>

  <!-- trim note -->
  <rect x="24" y="412" width="912" height="74" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="44" y="440" font-size="15" font-weight="700" fill="#854d0e">Later, independently:</text>
  <text x="44" y="464" font-size="13.5" fill="#713f12">local retention trims a segment once its data is uploaded. Disk holds only a recent window, while S3 keeps the rest.</text>
</svg>
