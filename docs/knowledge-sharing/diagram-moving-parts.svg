<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#16a34a"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <marker id="k" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="30" y="40" font-size="23" font-weight="700" fill="#111827">The moving parts</text>
  <text x="30" y="62" font-size="13" fill="#6b7280">green: the upload path (out to S3) · blue: the read path (back from S3) · nothing here sits between a publisher and its confirm</text>

  <!-- node container -->
  <rect x="24" y="78" width="652" height="498" rx="12" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="40" y="104" font-size="15" font-weight="700" fill="#374151">Local broker node</text>

  <!-- S3 container -->
  <rect x="716" y="120" width="258" height="300" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="731" y="146" font-size="15" font-weight="700" fill="#1e293b">Amazon S3</text>
  <rect x="734" y="158" width="222" height="92" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="845" y="196" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">fragments</text>
  <text x="845" y="216" font-size="11.5" fill="#475569" text-anchor="middle">64 MiB data objects</text>
  <rect x="734" y="262" width="222" height="138" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="845" y="290" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">manifest</text>
  <text x="845" y="310" font-size="11.5" fill="#475569" text-anchor="middle">offset → fragment index</text>
  <text x="845" y="327" font-size="11.5" fill="#475569" text-anchor="middle">(shallow tree)</text>
  <text x="845" y="356" font-size="11" fill="#475569" text-anchor="middle">pointer + version in Khepri</text>
  <text x="845" y="372" font-size="11" fill="#475569" text-anchor="middle">for safe concurrent writes</text>

  <!-- replica reader (uploader) -->
  <rect x="300" y="128" width="210" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="405" y="160" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">replica reader</text>
  <text x="405" y="180" font-size="12" fill="#166534" text-anchor="middle">uploader · one per stream</text>

  <!-- governor -->
  <rect x="540" y="140" width="112" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="596" y="161" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">governor</text>
  <text x="596" y="177" font-size="10.5" fill="#166534" text-anchor="middle">paces uploads</text>

  <!-- osiris log (hub) -->
  <rect x="300" y="300" width="210" height="82" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="405" y="335" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">osiris log</text>
  <text x="405" y="356" font-size="12" fill="#374151" text-anchor="middle">local disk segments</text>

  <!-- osiris_writer: where new data comes from -->
  <rect x="60" y="300" width="150" height="82" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="135" y="335" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">osiris_writer</text>
  <text x="135" y="356" font-size="12" fill="#374151" text-anchor="middle">stream leader</text>

  <!-- publishers -> writer -->
  <line x1="135" y1="250" x2="135" y2="298" stroke="#6b7280" stroke-width="2" marker-end="url(#k)"/>
  <text x="135" y="242" font-size="11.5" fill="#6b7280" text-anchor="middle">publishers</text>

  <!-- writer -> log: new data appended -->
  <line x1="210" y1="341" x2="298" y2="341" stroke="#6b7280" stroke-width="2" marker-end="url(#k)"/>
  <text x="254" y="332" font-size="11" fill="#374151" text-anchor="middle">writes chunks</text>

  <!-- consumer -->
  <rect x="44" y="474" width="120" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="104" y="511" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">consumer</text>

  <!-- log reader -->
  <rect x="210" y="474" width="140" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="511" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">log reader</text>

  <!-- remote reader -->
  <rect x="400" y="474" width="180" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="490" y="502" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">remote reader</text>
  <text x="490" y="521" font-size="11" fill="#1d4ed8" text-anchor="middle">one per consumer</text>

  <!-- A1 osiris log -> replica reader -->
  <line x1="405" y1="300" x2="405" y2="204" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <text x="416" y="256" font-size="11.5" fill="#166534">reads committed chunks</text>

  <!-- A2 replica reader -> governor -->
  <line x1="510" y1="164" x2="538" y2="164" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <!-- A3 governor -> S3 -->
  <line x1="652" y1="165" x2="714" y2="182" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <text x="688" y="126" font-size="11.5" fill="#166534" text-anchor="middle">PUT to S3</text>

  <!-- A4 consumer -> log reader -->
  <line x1="164" y1="506" x2="208" y2="506" stroke="#6b7280" stroke-width="2" marker-end="url(#k)"/>

  <!-- A5 log reader -> osiris log (recent/local) -->
  <line x1="292" y1="474" x2="352" y2="384" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <text x="232" y="440" font-size="11" fill="#1d4ed8">recent data:</text>
  <text x="232" y="455" font-size="11" fill="#1d4ed8">local disk</text>

  <!-- A6 log reader -> remote reader (older) -->
  <line x1="350" y1="506" x2="398" y2="506" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <text x="374" y="495" font-size="10.5" fill="#1d4ed8" text-anchor="middle">older</text>

  <!-- A7 remote reader -> S3 -->
  <line x1="580" y1="500" x2="714" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <text x="600" y="430" font-size="11.5" fill="#1d4ed8">range GET,</text>
  <text x="600" y="446" font-size="11.5" fill="#1d4ed8">iterate manifest</text>

  <!-- retention/reaper note -->
  <text x="40" y="556" font-size="11.5" fill="#6b7280">Retention and the reaper (not shown) delete fragments from S3 when remote retention expires them or a stream is deleted.</text>
</svg>
