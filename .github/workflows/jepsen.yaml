name: Jepsen

# Black-box, real-cluster Jepsen test for rabbitmq_stream_s3. It builds the
# broker tarball, brings up a 5-node cluster with MinIO behind Toxiproxy via
# docker compose, drives the kafka workload under faults, and fails the build if
# the checker reports anomalies. See jepsen/README.md.
#
# This is a heavy test (a full server build plus a multi-node cluster), so it
# runs on demand, on a schedule, and on changes to the harness itself, rather
# than on every pull request; the scheduled run is what catches plugin
# regressions over time. It builds the broker from a fresh clone rather than the
# Build-RMQ cache, because package-generic-unix must run on a clean source tree
# (a pre-compiled tree duplicates entries in the CLI escript and fails to zip).

on:
  workflow_dispatch:
    inputs:
      time-limit:
        description: 'Seconds to run the workload'
        default: '120'
      rate:
        description: 'Approximate request rate per second'
        default: '100'
      concurrency:
        description: 'Number of concurrent workers'
        default: '20'
  schedule:
    - cron: '0 6 * * 1' # Weekly, Mondays 06:00 UTC
  pull_request:
    paths:
      - 'jepsen/**'
      - '.github/workflows/jepsen.yaml'

permissions:
  contents: read

# Jepsen runs are expensive and each binds the same host ports, so never run two
# for the same ref at once.
concurrency:
  group: jepsen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jepsen:
    runs-on: ubuntu-latest
    # Safety net: a wedged run must fail fast, not burn hours. The build plus a
    # bounded 120s test settles well inside this.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rmq-version: ['streams-tiered-storage']
        # One job per scenario: storage-tier faults, writer fencing, and
        # manifest-replica cache consistency under an S3 outage plus leader churn.
        # final-read-tier is a coverage knob, not a fault: 's3' forces the final
        # reads off the local tier (so the tiering checker asserts reads were
        # served from S3), 'local' leaves them local.
        scenario:
          - faults: 'partition,s3-outage,s3-latency'
            final-read-tier: 's3'
          - faults: 'leader-move'
            final-read-tier: 's3'
          - faults: 's3-outage,leader-move'
            final-read-tier: 'local'
        include:
          - rmq-version: 'streams-tiered-storage'
            otp-version: 27
            elixir-version: 1.18
    steps:
      - name: Free up disk space
        # A full server build plus five brokers, MinIO and Toxiproxy is
        # disk-hungry; drop preinstalled toolchains the job does not need.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          df -h /
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp-version }}
          elixir-version: ${{ matrix.elixir-version }}
      - name: Clone rabbitmq-server
        # The server is built and run as part of the cluster, so pin it to a
        # commit SHA rather than the mutable streams-tiered-storage branch tip:
        # a CI run then builds exactly the server it was tested against, and a
        # force-push to the branch cannot change what executes here. Bump this
        # SHA periodically to track the branch (that re-introduces server-drift
        # coverage at a controlled point). Shallow-fetch the SHA directly so the
        # checkout keeps working once the branch tip has moved past the pin.
        env:
          RMQ_SERVER_SHA: 2f3527a84b549aa922693a96c1b6e7dc951caebe
        run: |
          git init -q "${{ github.workspace }}/rabbitmq-server"
          git -C "${{ github.workspace }}/rabbitmq-server" remote add origin \
            https://github.com/amazon-mq/upstream-to-rabbitmq-server.git
          git -C "${{ github.workspace }}/rabbitmq-server" fetch -q --depth 1 origin "$RMQ_SERVER_SHA"
          git -C "${{ github.workspace }}/rabbitmq-server" checkout -q "$RMQ_SERVER_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rabbitmq-server/deps/rabbitmq_stream_s3
          # The job then runs a full server build plus a lein dependency
          # download and a RabbitMQ cluster; do not leave the token in .git/config
          # for that third-party code to read.
          persist-credentials: false
      - name: Run Jepsen
        working-directory: rabbitmq-server/deps/rabbitmq_stream_s3
        run: jepsen/ci/run-jepsen.sh
        env:
          FAULTS: ${{ matrix.scenario.faults }}
          FINAL_READ_TIER: ${{ matrix.scenario.final-read-tier }}
          TIME_LIMIT: ${{ github.event.inputs.time-limit || '120' }}
          RATE: ${{ github.event.inputs.rate || '100' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '20' }}
      - name: Upload Jepsen store
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jepsen-store-${{ strategy.job-index }}
          if-no-files-found: ignore
          path: rabbitmq-server/deps/rabbitmq_stream_s3/jepsen/jepsen.streams3/store/
      - name: Tear down cluster
        if: always()
        working-directory: rabbitmq-server/deps/rabbitmq_stream_s3/jepsen/docker
        run: docker compose down -v || true
